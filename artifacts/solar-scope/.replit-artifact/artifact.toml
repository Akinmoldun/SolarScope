kind = "web"
previewPath = "/"
title = "SolarScope Simulator"
description = "An interactive solar-farm simulator that helps non-experts compare fixed, single-axis, and dual-axis solar tracking by visualizing sunlight, energy production, shading, weather, and payback."
version = "1.0.0"
id = "artifacts/solar-scope"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18925

[services.development]
run = "pnpm --filter @workspace/solar-scope run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/solar-scope", "run", "build" ]
serve = "static"
publicDir = "artifacts/solar-scope/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18925"
BASE_PATH = "/"
